[project]
name = "proyecto-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tatiana Lamamié de Clairac", email = "tatianalamamie@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[project.scripts]
proyecto-1 = "proyecto_1:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = [
    "integration: tests de integracion"
]