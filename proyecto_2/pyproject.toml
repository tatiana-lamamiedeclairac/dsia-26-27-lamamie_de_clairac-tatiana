[project]
name = "proyecto-2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tatiana Lamamié de Clairac", email = "tatianalamamie@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
proyecto-2 = "proyecto_2:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
